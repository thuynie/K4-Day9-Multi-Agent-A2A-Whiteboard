[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-multi-agent-dispute"
version = "0.1.0"
description = "Giải pháp cá nhân cho bài Multi-Agent E-commerce Dispute Resolution"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ec-dispute = "ec_dispute.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
